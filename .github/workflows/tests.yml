name: Scientific validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[notebook,test]'
      - run: python -m pytest -q
      - run: python scripts/execute_notebook.py --output runs/notebook_validation.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-validation-results
          path: runs/
