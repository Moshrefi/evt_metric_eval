[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evt-metric-eval"
version = "0.1.0"
description = "Independent, controlled event-stream metric failure analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2", "matplotlib>=3.7", "pillow>=10"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "h5py>=3.10"]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "h5py>=3.10"]

[tool.setuptools.packages.find]
include = ["event_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
